<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>I-Sakuyyyy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--w:#fff;--g:#e9e9e9;--m:#6b6b6b;--r:#e4002b;--y:#ffd100}
*{box-sizing:border-box;margin:0}
html,body{background:var(--k);color:var(--w);font:16px/1.4 Archivo,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:14px}
h1,h2,.big{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em}
h2{font-size:22px;margin:22px 0 10px}
.panel{background:var(--w);color:var(--k);padding:14px;margin-bottom:12px;border-left:8px solid var(--k)}
.panel.y{border-color:var(--y)}.panel.r{border-color:var(--r)}
.hero{border:3px solid var(--w);padding:16px;margin-bottom:12px}
.hero .big{font-size:46px;color:var(--y);line-height:1.1}
.lbl{font-size:13px;color:var(--m);font-weight:600}
.hero .lbl{color:#bbb}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g)}
.row:last-child{border:0}
.out{color:var(--r);font-weight:800}.in{color:#000;font-weight:800;background:var(--y);padding:0 4px}
.warn{background:var(--r);color:var(--w);padding:12px;font-weight:800;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--w);display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:4px solid var(--y)}
nav button{flex:1;border:0;background:none;padding:14px 0;font:800 13px Archivo;color:var(--k)}
nav button.on{background:var(--k);color:var(--y)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--k)}
input,select{width:100%;padding:12px;border:2px solid var(--k);background:var(--w);color:var(--k);font:inherit;border-radius:0}
.seg{display:flex}.seg button{flex:1;padding:12px;border:2px solid var(--k);background:var(--w);font:800 15px Archivo;color:var(--k)}
.seg button.on.o{background:var(--r);color:var(--w)}.seg button.on.i{background:var(--y)}.seg button.on.t{background:var(--k);color:var(--w)}
.btn{width:100%;margin-top:14px;padding:14px;border:0;background:var(--k);color:var(--y);font:400 20px Anton;letter-spacing:.04em}
.sm{border:2px solid var(--k);background:var(--w);color:var(--k);padding:4px 10px;font:800 13px Archivo}
.bar{height:10px;background:var(--g);margin-top:4px}.bar i{display:block;height:100%;background:var(--r)}.bar.in i{background:var(--y);outline:1px solid #000}
.grp{font-weight:800;margin:10px 0 2px}
.empty{color:var(--m);padding:10px 0}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.warn{animation:p 1.2s 2}@keyframes p{50%{opacity:.6}}}

h1{text-shadow:3px 3px 0 var(--r)}
.panel{box-shadow:7px 7px 0 #555;border:2px solid var(--k);border-left-width:8px;margin-bottom:20px}
.panel.y,.panel.r{border-color:var(--k)}
.panel.y{border-left-color:var(--y);box-shadow:7px 7px 0 var(--y)}
.panel.r{border-left-color:var(--r);box-shadow:7px 7px 0 var(--r)}
.hero{background:#111;box-shadow:8px 8px 0 var(--r);margin-bottom:22px}
.hero .big{text-shadow:1px 1px 0 var(--r),2px 2px 0 var(--r),3px 3px 0 var(--r),4px 4px 0 var(--r)}
.tilt{transition:transform .18s ease-out;will-change:transform}
.btn{box-shadow:0 6px 0 var(--r);margin-bottom:8px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--r)}
.sm,.seg button{box-shadow:0 3px 0 var(--k);transition:transform .08s,box-shadow .08s}
.sm:active,.seg button:active{transform:translateY(3px);box-shadow:none}
.seg button.on{background:var(--k);color:var(--y)}
nav button{transition:transform .15s}
nav button.on{transform:translateY(-5px) scale(1.06);box-shadow:0 4px 0 var(--r)}
.bar{height:16px;border:2px solid var(--k);box-shadow:3px 3px 0 var(--k)}
.bar i{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.dn{width:210px;display:block;margin:6px auto 16px;filter:drop-shadow(5px 6px 0 #000)}
.lg{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}
.lg i{width:14px;height:14px;display:inline-block;margin-right:8px;border:2px solid #000;vertical-align:-2px}
.cols{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 12px;align-items:flex-end}
.col{flex:0 0 40px;text-align:center;font-size:11px;font-weight:600}
.pair{height:160px;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.pair i{width:14px;border:2px solid #000;box-shadow:3px 3px 0 #000;transform-origin:bottom}
.pair i.o{background:var(--r)}.pair i.n{background:var(--y)}
@media (prefers-reduced-motion:no-preference){
.sg{animation:dn .9s cubic-bezier(.2,.8,.2,1) both}@keyframes dn{from{stroke-dasharray:0 100}}
.dn{animation:sp .8s cubic-bezier(.2,.9,.3,1)}@keyframes sp{from{transform:rotate(-100deg) scale(.5);opacity:0}}
.bar i{animation:gr .7s cubic-bezier(.2,.8,.2,1)}@keyframes gr{from{width:0}}
.pair i{animation:gh .7s cubic-bezier(.2,.8,.2,1)}@keyframes gh{from{transform:scaleY(0)}}}

@media (prefers-reduced-motion:no-preference){
.sg{animation:dn2 1.1s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i,0)*.12s + .25s)}
@keyframes dn2{from{stroke-dasharray:0 100;stroke-width:13}}
.dn{animation:sp2 1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sp2{from{transform:rotate(-300deg) scale(.2);opacity:0}60%{opacity:1}}
.dn text{animation:pop .5s .9s cubic-bezier(.34,1.8,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}}
.lg{animation:sl .5s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i,0)*.07s + .5s)}
@keyframes sl{from{transform:translateX(-40px) skewX(-12deg);opacity:0}}
.bar i{animation:gr2 .9s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0)*.09s)}
@keyframes gr2{from{width:0;filter:brightness(2)}}
.pair i{animation:gh2 .8s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*.06s)}
@keyframes gh2{from{transform:scaleY(0);filter:brightness(2)}}
.enter .hero{animation:slam .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slam{0%{transform:scale(2.4) rotate(-10deg);opacity:0}45%{transform:scale(.92) rotate(1deg);opacity:1}65%{transform:scale(1.04)}100%{transform:none}}
.enter .panel{animation:flip .6s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--n,0)*.08s + .1s);transform-origin:top}
@keyframes flip{from{transform:perspective(600px) rotateX(-80deg) translateY(-20px);opacity:0}}
nav button.on{animation:nv .4s cubic-bezier(.3,2,.5,1)}
@keyframes nv{from{transform:translateY(8px) scale(.8)}}
.flash{animation:fl .7s}@keyframes fl{30%{color:#fff;text-shadow:0 0 22px var(--y),4px 4px 0 var(--r)}}}

[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px}
.sp-stripes{position:absolute;inset:-50%;opacity:.4;background:repeating-linear-gradient(115deg,transparent 0 60px,var(--r) 60px 72px,transparent 72px 130px,var(--y) 130px 138px)}
.sp-box{position:relative;background:#000;border:3px solid #fff;box-shadow:10px 10px 0 var(--r);padding:26px 22px;width:min(100%,380px);text-align:center}
.sp-t{font:400 68px/1 Anton,Impact,sans-serif;color:var(--y);text-shadow:1px 1px 0 var(--r),2px 2px 0 var(--r),3px 3px 0 var(--r),4px 4px 0 var(--r),5px 5px 0 var(--r),6px 6px 0 var(--r)}
.sp-s{color:#bbb;font-size:14px;margin:16px 0 18px}
.sp-load{height:16px;border:2px solid #fff;box-shadow:4px 4px 0 var(--y)}
#sbar{height:100%;width:0;background:var(--r);transition:width .14s linear}
#spct{margin-top:10px;font-weight:800}
.sp-go{background:var(--y);color:#000;margin-top:16px}
#splash.out{animation:sout .65s cubic-bezier(.6,0,.9,.4) forwards;pointer-events:none}
@keyframes sout{to{transform:scale(2.6);opacity:0;filter:blur(6px)}}
@media (prefers-reduced-motion:no-preference){
.sp-stripes{animation:st 1.6s linear infinite}@keyframes st{to{transform:translateX(152.3px)}}
.sp-box{animation:slam 1s cubic-bezier(.2,.8,.2,1) backwards}
.sp-go.show{animation:pop2 .6s cubic-bezier(.34,1.8,.5,1),bump 1.3s .7s ease-in-out infinite}
@keyframes pop2{from{transform:scale(0) rotate(-12deg)}}@keyframes bump{50%{transform:scale(1.05)}}}

.seg button.on.i{color:var(--k)}.seg button.on.o,.seg button.on.t{color:var(--w)}
.sp-t{font-size:54px}
.sp-av{display:block;width:150px;height:165px;margin:0 auto 16px;border:3px solid #fff;box-shadow:6px 6px 0 var(--y)}
.pbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;align-items:center;gap:14px;background:var(--w);color:var(--k);border:3px solid var(--k);box-shadow:6px 6px 0 var(--y);padding:8px 12px;margin:4px 6px 18px 0}
.av{width:64px;height:70px;flex:none;border:3px solid var(--k);box-shadow:3px 3px 0 var(--r)}
@media (prefers-reduced-motion:no-preference){.sp-av{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(1.5deg)}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#000"/></pattern>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd100"/><stop offset="1" stop-color="#ff7a00"/></linearGradient></defs>
<symbol id="chr" viewBox="0 0 200 220">
<rect width="200" height="220" fill="url(#sky)"/><circle cx="100" cy="118" r="82" fill="#e4002b"/>
<g fill="#ffd100"><rect x="21" y="134" width="158" height="3"/><rect x="24" y="146" width="152" height="4"/><rect x="32" y="160" width="136" height="5"/></g>
<rect y="120" width="200" height="100" fill="url(#ht)" opacity=".18"/>
<path d="M14 222 C16 172 48 150 100 150 C152 150 184 172 186 222Z" fill="#0b0b0b" stroke="#000" stroke-width="3"/>
<path d="M70 154 L100 208 L130 154 L143 160 L106 224 L94 224 L57 160Z" fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M64 161 L98 217 M136 161 L102 217" stroke="#ffd100" stroke-width="3" stroke-dasharray="4 3"/>
<path d="M50 104 C46 58 72 40 100 40 C128 40 154 58 150 104 C149 130 142 152 130 162 L70 162 C58 152 51 130 50 104Z" fill="#2b2b2b" stroke="#000" stroke-width="3"/>
<path d="M60 120 C58 140 66 154 76 160 M140 120 C142 140 134 154 124 160" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="100" cy="102" rx="31" ry="38" fill="#e2a977" stroke="#000" stroke-width="3"/>
<path d="M72 112 C76 130 90 142 100 142 C110 142 124 130 128 112 C120 132 80 132 72 112Z" fill="#c78a5a" opacity=".55"/>
<path d="M68 90 C68 58 132 58 132 90 C118 74 82 74 68 90Z" fill="#2b2b2b" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
<path d="M78 91 L96 95 M122 91 L104 95" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
<ellipse cx="88" cy="102" rx="7" ry="3.6" fill="#fff" stroke="#000" stroke-width="2"/><ellipse cx="112" cy="102" rx="7" ry="3.6" fill="#fff" stroke="#000" stroke-width="2"/>
<circle cx="89" cy="102" r="2.8"/><circle cx="111" cy="102" r="2.8"/>
<path d="M100 106 L96 118 L103 119" fill="none" stroke="#9a5f35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M89 127 Q100 123 111 127 Q100 137 89 127Z" fill="#e4002b" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M26 206 L40 156 L62 118 L82 130 L64 174 L58 214Z" fill="#0b0b0b" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
<circle cx="66" cy="116" r="11" fill="#e2a977" stroke="#000" stroke-width="3"/>
<path d="M70 108 L80 96" stroke="#000" stroke-width="11" stroke-linecap="round"/><path d="M70 108 L80 96" stroke="#e2a977" stroke-width="6" stroke-linecap="round"/>
<path d="M74 58 L74 72 C90 82 118 82 130 72 L130 56Z" fill="#161616" stroke="#000" stroke-width="3"/>
<path d="M36 50 L104 24 L170 46 L104 74Z" fill="#0b0b0b" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
<path d="M44 51 L104 30 L160 47" fill="none" stroke="#555" stroke-width="2"/>
<path d="M104 49 L158 47 L160 70" fill="none" stroke="#ffd100" stroke-width="3.5" stroke-linecap="round"/>
<rect x="156" y="66" width="8" height="16" rx="2" fill="#ffd100" stroke="#000" stroke-width="2"/><circle cx="104" cy="49" r="4" fill="#ffd100" stroke="#000" stroke-width="2"/>
</symbol></svg>
<div id="splash"><div class="sp-stripes"></div><div class="sp-box"><svg class="sp-av" viewBox="0 0 200 220" role="img" aria-label="Karakter I-Sakuyyyy"><use href="#chr" width="200" height="220"/></svg>
<div class="sp-t">I-Sakuyyyy</div>
<div class="sp-s">Catat uang masuk, keluar, dan pindah dana.</div><div class="sp-load"><div id="sbar"></div></div><div id="spct">0%</div>
<button class="btn sp-go" id="sgo" hidden>Masuk</button></div></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const WALLETS={'Cash':['Cash'],'M-Banking':["Livin'",'BRI Britama','SeaBank','BRI Simpedes'],'E-Wallet':['DANA','Tabungan Terkunci']};
const ALLW=Object.values(WALLETS).flat();
const CAT={out:['Makan','Minum','Ngopi','Jajan','Shopping','Wajib elektronik','Wajib kendaraan','Cicilan wisuda','Bantuan keluarga','Modal bisnis DANA'],
 in:['Gaji MagangHub','Fee bisnis DANA','Pemasukan lain']};
const SUBS={'Wajib elektronik':['Listrik','WiFi','Paket data'],'Wajib kendaraan':['Bensin','Service','Parkir','Pajak & STNK','Lainnya']};
const TABS=[['home','Beranda'],['add','Catat'],['hist','Riwayat'],['debt','Utang'],['stat','Statistik'],['set','Atur']];
const K='kasharian.v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{tx:[],debt:[],cfg:{hour:20,url:'',token:'',lastPush:0,lastNotif:''}};
S.tx=S.tx.filter(x=>!String(x.id).startsWith('demo-'));S.debt=S.debt.filter(x=>!String(x.id).startsWith('demo-'));save();
let lastView='',view='home',form={type:'out'},filt='all',syncMsg='';
const $=s=>document.querySelector(s);
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const live=a=>a.filter(x=>!x.d);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function touch(o){o.u=Date.now();save();scheduleSync()}
function balances(){const b={};ALLW.forEach(w=>b[w]=0);
 live(S.tx).forEach(t=>{const a=t.amt;
  if(t.type==='in'||t.type==='init')b[t.w]=(b[t.w]||0)+a;
  else if(t.type==='out')b[t.w]=(b[t.w]||0)-a;
  else if(t.type==='tf'){b[t.w]=(b[t.w]||0)-a-(t.fee||0);b[t.to]=(b[t.to]||0)+a}});return b}
function sumDay(d,type){return live(S.tx).filter(t=>t.date===d&&t.type===type).reduce((s,t)=>s+t.amt,0)}

function render(){
 $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${view===k?'on':''}" data-v="${k}">${n}</button>`).join('');
 $('#app').innerHTML=({home,add:addV,hist,debt,stat,set:setV})[view]();
 const ent=view!==lastView;lastView=view;$('#app').className=ent?'enter':'';
 document.querySelectorAll('#app .hero,#app .panel').forEach((e,i)=>e.style.setProperty('--n',i));
 bind();tilt();if(view==='home'&&ent)countUp();
}
function assistant(){
 const d=today(),o=sumDay(d,'out'),i=sumDay(d,'in');
 const none=!live(S.tx).some(t=>t.date===d&&t.type!=='init');
 const late=new Date().getHours()>=S.cfg.hour;
 return (none&&late?`<div class="warn">Belum ada catatan hari ini. Cek lagi: ada pengeluaran atau fee DANA yang lupa dicatat?</div>`:'')+
 `<div class="panel y"><div class="lbl">Hari ini</div>
  <div class="row"><span>Pengeluaran</span><span class="out">${rp(o)}</span></div>
  <div class="row"><span>Pemasukan / fee</span><span class="in">${rp(i)}</span></div></div>`}
function home(){
 const b=balances(),tot=Object.values(b).reduce((a,c)=>a+c,0);
 const act=live(S.debt).filter(x=>!x.paid&&x.kind==='utang').reduce((s,x)=>s+x.amt,0);
 return `<h1 style="font-size:30px;margin:6px 0 12px">I-Sakuyyyy</h1>`+assistant()+
 `<div class="hero tilt"><div class="lbl">Total semua dompet</div><div class="big" id="tot" data-to="${tot}">${rp(tot)}</div>
  <div class="lbl" style="margin-top:6px">Utang aktif ${rp(act)}</div></div>`+
 Object.entries(WALLETS).map(([g,ws])=>`<div class="panel tilt"><div class="grp">${g}</div>`+
  ws.map(w=>`<div class="row"><span>${esc(w)}</span><b class="${b[w]<0?'out':''}">${rp(b[w])}</b></div>`).join('')+`</div>`).join('')+
 `<div class="lbl">${esc(syncMsg)}</div>`}
const opt=(arr,sel)=>arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
function addV(){
 const t=form.type,tf=t==='tf';
 return `<h2>Catat transaksi</h2><div class="panel">
 <div class="seg"><button data-t="out" class="o ${t==='out'?'on':''}">Keluar</button><button data-t="in" class="i ${t==='in'?'on':''}">Masuk</button><button data-t="tf" class="t ${tf?'on':''}">Pindah dana</button></div>
 <label for="amt">Jumlah (Rp)</label><input id="amt" type="number" inputmode="numeric" min="1">
 ${tf?'':`<label for="cat">Kategori</label><select id="cat">${opt(CAT[t])}</select><div id="subw" hidden><label for="sub">Detail</label><select id="sub"></select></div>`}
 <label for="w">${tf?'Dari dompet':'Dompet'}</label><select id="w">${opt(ALLW)}</select>
 ${tf?`<label for="to">Ke dompet</label><select id="to">${opt(ALLW,'DANA')}</select><label for="fee">Biaya admin (Rp)</label><input id="fee" type="number" inputmode="numeric" min="0" value="0">`:''}
 <label for="dt">Tanggal</label><input id="dt" type="date" value="${today()}">
 <label for="nt" id="ntl">Keterangan</label><input id="nt" maxlength="80">
 <div id="err" class="out"></div><button class="btn" id="saveTx">Simpan</button></div>`}
function hist(){
 const f=filt,list=live(S.tx).filter(t=>t.type!=='init'&&(f==='all'||t.type===f)).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u);
 return `<h2>Riwayat</h2><select id="filt">${[['all','Semua'],['out','Pengeluaran'],['in','Pemasukan'],['tf','Pindah dana']].map(([v,n])=>`<option value="${v}" ${f===v?'selected':''}>${n}</option>`).join('')}</select>
 <div class="panel" style="margin-top:12px">${list.length?list.map(t=>`<div class="row"><div><b>${t.type==='tf'?esc(t.w)+' → '+esc(t.to):esc(t.cat)+(t.sub?' › '+esc(t.sub):'')}</b><div class="lbl">${t.date}${t.type==='tf'?'':' · '+esc(t.w)}${t.fee?' · admin '+rp(t.fee):''}${t.note?' · '+esc(t.note):''}</div></div>
 <div style="text-align:right"><span class="${t.type==='out'?'out':t.type==='in'?'in':''}">${t.type==='out'?'-':t.type==='in'?'+':''}${rp(t.amt)}</span><br><button class="sm" data-del="tx:${t.id}">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada transaksi. Mulai dari tab Catat.</div>'}</div>`}
function debt(){
 const l=live(S.debt).sort((a,b)=>a.paid-b.paid||b.u-a.u),sm=k=>l.filter(x=>!x.paid&&x.kind===k).reduce((s,x)=>s+x.amt,0);
 return `<h2>Utang & piutang</h2><div class="panel r"><div class="row"><span>Utang aktif</span><b class="out">${rp(sm('utang'))}</b></div><div class="row"><span>Piutang aktif</span><b>${rp(sm('piutang'))}</b></div></div>
 <div class="panel"><label for="dn">Nama</label><input id="dn" maxlength="40"><label for="da">Jumlah (Rp)</label><input id="da" type="number" inputmode="numeric" min="1">
 <label for="dk">Jenis</label><select id="dk"><option value="utang">Utang (aku berutang)</option><option value="piutang">Piutang (orang berutang ke aku)</option></select>
 <button class="btn" id="saveDebt">Simpan catatan</button></div>
 <div class="panel">${l.length?l.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="lbl">${x.kind==='utang'?'Utang':'Piutang'} · ${x.paid?'Lunas':'Belum lunas'}</div></div>
 <div style="text-align:right"><b class="${x.paid?'':'out'}">${rp(x.amt)}</b><br><button class="sm" data-pay="${x.id}">${x.paid?'Batal lunas':'Tandai lunas'}</button> <button class="sm" data-del="debt:${x.id}">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada catatan.</div>'}</div>`}
let st={what:'out',by:'cat',chart:'donut',per:'month'};
const PAL=['#e4002b','#ffd100','#000','#6b6b6b','#ff7a8a','#b38f00','#999','#333','#ff4d6d','#d4c26a'];
function inPer(d){const t=today();if(st.per==='all')return true;if(st.per==='day')return d===t;if(st.per==='month')return d.startsWith(t.slice(0,7));
 const a=new Date();a.setDate(a.getDate()-6);const f=a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0')+'-'+String(a.getDate()).padStart(2,'0');return d>=f&&d<=t}
const segs=(k,o)=>`<div class="seg" style="margin-bottom:10px">${o.map(([v,n])=>`<button class="${st[k]===v?'on':''}" data-st="${k}:${v}">${n}</button>`).join('')}</div>`;
const short=n=>n>=1e6?(n/1e6).toFixed(1)+' jt':Math.round(n/1000)+' rb';
function donut(it,cols){cols=cols||PAL;const tot=it.reduce((a,c)=>a+c.v,0);let off=0;
 const sg=it.map((x,i)=>{const p=x.v/tot*100,c=`<circle class="sg" style="--i:${i}" cx="21" cy="21" r="15.9155" fill="none" stroke="${cols[i%cols.length]}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=p;return c}).join('');
 return `<svg viewBox="0 0 42 42" class="dn" role="img" aria-label="Grafik donat"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#e9e9e9" stroke-width="7"/>${sg}<text x="21" y="22.4" text-anchor="middle" style="font:400 4.2px Anton">${short(tot)}</text></svg>`+
 it.map((x,i)=>`<div class="lg" style="--i:${i}"><span><i style="background:${cols[i%cols.length]}"></i>${esc(x.l)}</span><span>${rp(x.v)} · ${Math.round(x.v/tot*100)}%</span></div>`).join('')}
function stat(){
 const W=st.what,tx=live(S.tx).filter(t=>t.type!=='init'&&t.type!=='tf'&&inPer(t.date));let body='';
 if(W==='flow'){
  const dy={};tx.forEach(t=>{const o=dy[t.date]||(dy[t.date]={in:0,out:0});o[t.type]+=t.amt});
  const ds=Object.keys(dy).sort().slice(-14),sm=ty=>tx.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0),ti=sm('in'),to=sm('out');
  if(!ds.length)body='<div class="empty">Belum ada data di periode ini.</div>';
  else{
   if(st.chart==='donut')body=donut([{l:'Masuk',v:ti},{l:'Keluar',v:to}].filter(x=>x.v>0),ti&&to?['#ffd100','#e4002b']:[ti?'#ffd100':'#e4002b']);
   else{const mx=Math.max(...ds.map(d=>Math.max(dy[d].in,dy[d].out)),1);
    body=`<div class="cols">${ds.map((d,k)=>`<div class="col" style="--i:${k}"><div class="pair"><i class="n" style="height:${dy[d].in/mx*100}%"></i><i class="o" style="height:${dy[d].out/mx*100}%"></i></div>${d.slice(8)}/${d.slice(5,7)}</div>`).join('')}</div><div class="lbl">Kuning = masuk, merah = keluar</div>`}
   body+=`<div class="row"><span>Selisih</span><b>${rp(ti-to)}</b></div>`}
 }else{
  const by={};tx.filter(t=>t.type===W).forEach(t=>{const k=st.by==='cat'?t.cat:st.by==='sub'?(t.sub?t.cat+' › '+t.sub:t.cat):t.w;by[k]=(by[k]||0)+t.amt});
  const it=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})),tot=it.reduce((s,x)=>s+x.v,0);
  if(!it.length)body='<div class="empty">Belum ada data di periode ini.</div>';
  else{
   body=st.chart==='donut'?donut(it):it.map((x,k)=>`<div style="margin:10px 0"><div class="row" style="border:0;padding:0"><span>${esc(x.l)}</span><span>${rp(x.v)} · ${Math.round(x.v/tot*100)}%</span></div><div class="bar ${W}" style="--i:${k}"><i style="width:${x.v/tot*100}%"></i></div></div>`).join('');
   body+=`<div class="row"><span>Total</span><b>${rp(tot)}</b></div>`}}
 return `<h2>Statistik</h2><div class="panel y"><div class="lbl">Data</div>${segs('what',[['out','Keluar'],['in','Masuk'],['flow','Arus kas']])}`+
 (W==='flow'?'':`<div class="lbl">Kelompok</div>${segs('by',[['cat','Kategori'],['sub','Detail'],['w','Dompet']])}`)+
 `<div class="lbl">Grafik</div>${segs('chart',[['donut','Donat'],['bar','Batang']])}<div class="lbl">Periode</div>${segs('per',[['day','Hari ini'],['week','7 hari'],['month','Bulan ini'],['all','Semua']])}</div><div class="panel ${W==='in'?'y':'r'}">${body}</div>`}
function tilt(){document.querySelectorAll('.tilt').forEach(e=>{
 e.onpointermove=ev=>{const r=e.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;e.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`};
 e.onpointerleave=e.onpointerup=e.onpointercancel=()=>{e.style.transform=''}})}
let cu=0;function countUp(){const e=$('#tot');if(!e)return;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const to=+e.dataset.to,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=rp(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);else e.classList.add('flash')})(t0)}
function setV(){
 const init={};live(S.tx).filter(t=>t.type==='init').forEach(t=>init[t.w]=t.amt);
 return `<div class="pbar"><svg class="av" viewBox="0 0 200 220" aria-hidden="true"><use href="#chr" width="200" height="220"/></svg><div><div class="big" style="font-size:26px;line-height:1.1">I-Sakuyyyy</div><div class="lbl">Pengaturan</div></div></div><h2>Pengaturan</h2><div class="panel"><label for="hr">Jam pengingat (0–23)</label><input id="hr" type="number" min="0" max="23" value="${S.cfg.hour}">
 <button class="sm" id="notif" style="margin-top:10px">Izinkan notifikasi</button></div>
 <div class="panel"><div class="grp">Saldo awal dompet</div>${ALLW.map(w=>`<label>${esc(w)}<input data-init="${esc(w)}" type="number" inputmode="numeric" value="${init[w]??''}"></label>`).join('')}
 <button class="btn" id="saveInit">Simpan saldo awal</button></div>
 <div class="panel y"><div class="grp">Sinkron Google Sheets</div><label for="url">URL Web App Apps Script</label><input id="url" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec">
 <label for="tok">Token rahasia</label><input id="tok" value="${esc(S.cfg.token)}"><button class="btn" id="saveSync">Simpan & sinkron sekarang</button><div class="lbl" style="margin-top:8px">${esc(syncMsg)}</div></div>`}

function bind(){
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{form.type=b.dataset.t;render()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.del.split(':');if(!confirm('Hapus catatan ini?'))return;const o=S[k].find(x=>x.id===id);o.d=1;touch(o);render()});
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const o=S.debt.find(x=>x.id===b.dataset.pay);o.paid=o.paid?0:1;touch(o);render()});
 const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};

 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.st.split(':');st[k]=v;render()});
 const cs=$('#cat');if(cs){const u=()=>{const c=cs.value,sb=SUBS[c];$('#subw').hidden=!sb;if(sb)$('#sub').innerHTML=opt(sb);const sh=c==='Shopping';$('#ntl').textContent=sh?'Keterangan (wajib diisi)':'Keterangan';$('#nt').placeholder=sh?'Contoh: skin care, aksesoris, baju':''};cs.onchange=u;u()}
 const f=$('#filt');if(f)f.onchange=()=>{filt=f.value;render()};
 on('saveTx',()=>{
  const amt=+$('#amt').value,t=form.type,w=$('#w').value;
  if(!(amt>0)){$('#err').textContent='Isi jumlah lebih dari 0.';return}
  const o={id:uid(),type:t,amt,w,date:$('#dt').value||today(),note:$('#nt').value.trim()};
  if(t==='tf'){o.to=$('#to').value;o.fee=+$('#fee').value||0;if(o.to===w){$('#err').textContent='Dompet asal dan tujuan harus berbeda.';return}}else{o.cat=$('#cat').value;if(!$('#subw').hidden)o.sub=$('#sub').value;if(t==='out'&&o.cat==='Shopping'&&!o.note){$('#err').textContent='Shopping wajib diisi keterangan, misalnya skin care, aksesoris, atau baju.';$('#nt').focus();return}}
  S.tx.push(o);touch(o);view='home';render()});
 on('saveDebt',()=>{const name=$('#dn').value.trim(),amt=+$('#da').value;if(!name||!(amt>0)){alert('Isi nama dan jumlah.');return}
  const o={id:uid(),name,amt,kind:$('#dk').value,paid:0};S.debt.push(o);touch(o);render()});
 on('notif',()=>{if('Notification'in window)Notification.requestPermission().then(p=>alert('Notifikasi: '+p));else alert('Browser ini tidak mendukung notifikasi.')});
 on('saveInit',()=>{
  document.querySelectorAll('[data-init]').forEach(i=>{const w=i.dataset.init,id='init-'+w,v=+i.value||0;
   let o=S.tx.find(x=>x.id===id);
   if(!o&&!v)return;
   if(!o){o={id,type:'init',w,date:today(),cat:'Saldo awal'};S.tx.push(o)}
   if(o.amt!==v||o.d){o.amt=v;o.d=0;touch(o)}});
  const h=+$('#hr').value;if(h>=0&&h<=23)S.cfg.hour=h;save();render()});
 on('saveSync',()=>{S.cfg.url=$('#url').value.trim();S.cfg.token=$('#tok').value.trim();const h=+$('#hr').value;if(h>=0&&h<=23)S.cfg.hour=h;save();sync(true)});
}

/* ---- Sinkron Google Sheets (Apps Script) ---- */
let tm;function scheduleSync(){clearTimeout(tm);tm=setTimeout(()=>sync(false),1500)}
async function sync(manual){
 const c=S.cfg;if(!c.url||!c.token){if(manual){syncMsg='Isi URL dan token dulu.';render()}return}
 try{
  const now=Date.now();
  const tx=S.tx.filter(x=>x.u>c.lastPush),debt=S.debt.filter(x=>x.u>c.lastPush);
  if(tx.length||debt.length){
   const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,tx,debt})});
   const j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal kirim');}
  const r2=await fetch(c.url+(c.url.includes('?')?'&':'?')+'token='+encodeURIComponent(c.token));
  const j2=await r2.json();if(!j2.ok)throw new Error(j2.error||'Gagal ambil');
  ['tx','debt'].forEach(k=>{(j2[k]||[]).forEach(rm=>{const i=S[k].findIndex(x=>x.id===rm.id);
   if(i<0)S[k].push(rm);else if((rm.u||0)>(S[k][i].u||0))S[k][i]=rm})});
  c.lastPush=now;save();syncMsg='Tersinkron '+new Date().toLocaleTimeString('id-ID');
 }catch(e){syncMsg='Sinkron gagal: '+e.message+'. Data tetap aman di HP.'}
 render();
}

/* ---- Pengingat ---- */
function remind(){
 const d=today(),none=!live(S.tx).some(t=>t.date===d&&t.type!=='init');
 if(none&&new Date().getHours()>=S.cfg.hour&&S.cfg.lastNotif!==d){
  if('Notification'in window&&Notification.permission==='granted'){new Notification('I-Sakuyyyy',{body:'Belum ada catatan hari ini. Ada yang lupa dicatat?'});S.cfg.lastNotif=d;save()}
  if(view==='home')render();}
}
render();sync(false);setInterval(remind,60000);remind();
(function(){const sp=$('#splash'),bar=$('#sbar'),pct=$('#spct'),go=$('#sgo');let p=0;
 const t=setInterval(()=>{p=Math.min(100,p+Math.random()*14+5);bar.style.width=p+'%';pct.textContent=Math.floor(p)+'%';
  if(p>=100){clearInterval(t);pct.textContent='Siap';go.hidden=false;go.classList.add('show');go.focus()}},140);
 go.onclick=()=>{sp.classList.add('out');lastView='';render();setTimeout(()=>sp.remove(),700)}})();
</script>
</body>
